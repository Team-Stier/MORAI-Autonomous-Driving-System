execution:
  mode: on_input
  trigger_input: source
  queue_capacity: 8
inputs:
  source:
    type: morai_msgs/ObjectStatusList
    topic: /visualizer/object_info
    frame: map
    stale_after_sec: 0.3
    receive_timeout_sec: 0.3
    check_skew: true
  ego:
    type: nav_msgs/Odometry
    topic: /visualizer/gt
    frame: map
    numbers:
    - pose.pose.position.x
    - pose.pose.position.y
    - pose.pose.position.z
    - pose.pose.orientation.x
    - pose.pose.orientation.y
    - pose.pose.orientation.z
    - pose.pose.orientation.w
    stale_after_sec: 0.3
    receive_timeout_sec: 0.3
    check_skew: true
stages:
- name: render
  outputs:
  - name: marker
    type: visualization_msgs/Marker
output:
  topic: /visualizer/morai_objects
  frame_id: base_link
max_skew_sec: 0.05
