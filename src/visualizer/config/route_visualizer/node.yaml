execution:
  mode: periodic
  frequency_hz: 1.0
  queue_capacity: 1
inputs:
  source:
    type: nav_msgs/Path
    topic: /visualizer/global_path
    frame: map
    check_stamp: false
    check_receive_timeout: false
    check_skew: false
stages:
- name: render
  outputs:
  - name: marker
    type: visualization_msgs/Marker
output:
  topic: /visualizer/route
  frame_id: map
