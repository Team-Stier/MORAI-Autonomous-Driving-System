execution:
  mode: on_input
  trigger_input: source
  queue_capacity: 1
inputs:
  source:
    type: interfaces/Objects
    topic: /objects
    frame: map
    stale_after_sec: 0.3
    receive_timeout_sec: 0.3
    check_skew: false
stages:
- name: render
  outputs:
  - name: marker
    type: visualization_msgs/Marker
output:
  topic: /visualizer/objects
  frame_id: map
