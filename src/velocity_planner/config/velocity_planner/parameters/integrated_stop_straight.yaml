# Rear-axle distance before the line at which /traffic_light first reports the light; 0 disables.
blind_detection_distance_m: 9.0
blind_deceleration_mps2: 2.5
# YELLOW also stops when the front axle can stop yellow_stop_margin_m before the line at this deceleration; 0 disables.
yellow_stop_deceleration_mps2: 4.5
front_axle_m: 3.0
yellow_stop_margin_m: 0.5
# Lines whose light must be observed before passing; unobserved, the approach stops at the target and holds up to blind_hold_max_sec.
blind_hold_line_ids: [4188]
blind_hold_max_sec: 10.0
