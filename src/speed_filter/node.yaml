name: speed_filter_node
inputs:
  command:
    type: morai_msgs/CtrlCmd
    topic: '/control_cmd'
    limits:
      stale_after_sec: 0.06
      receive_timeout_sec: 0.06
      max_sensor_skew_sec: 0.1
      check_stamp: false
      check_skew: false
  competition:
    type: interfaces/CompetitionVehicleStatus
    topic: '/vehicle/competition_status'
    limits:
      stale_after_sec: 0.06
      receive_timeout_sec: 0.06
      max_sensor_skew_sec: 0.1
      frame: base_link
stages:
  stage1:
    cores: [speed_limit60.hpp, no_speed_limit.hpp]
    section_core_map:
      '0': speed_limit60.hpp
      '1': speed_limit60.hpp
      '2': speed_limit60.hpp
      '3': speed_limit60.hpp
      '4': speed_limit60.hpp
      '5': speed_limit60.hpp
      '6': speed_limit60.hpp
      '7': speed_limit60.hpp
      '8': speed_limit60.hpp
      '9': speed_limit60.hpp
      '10': no_speed_limit.hpp
      '11': speed_limit60.hpp
      '12': no_speed_limit.hpp
      '13': speed_limit60.hpp
      '14': speed_limit60.hpp
      '15': speed_limit60.hpp
      '16': speed_limit60.hpp
    health_core_map: []
    max_health_checks: 10
output:
  source: stage1.command
  topic: '/morai_udp_bridge/control_cmd'
  header: {}
execution:
  mode: on_input
  trigger_input: command
  queue_capacity: 1
section_topic: '/section_annotation'
