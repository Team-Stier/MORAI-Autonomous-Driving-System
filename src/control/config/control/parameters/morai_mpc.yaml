minimum_control_dt_sec: 0.04
maximum_control_dt_sec: 0.06
lateral:
  ctrl_period: 0.05
  enable_path_smoothing: false
  enable_yaw_recalculation: true
  path_filter_moving_ave_num: 35
  path_smoothing_times: 1
  curvature_smoothing_num: 3
  morai_yaw_smoothing_num: 5
  traj_resample_dist: 0.5
  vehicle_model_wheelbase: 3.0
  steer_lim_deg: 40.0
  morai_steer_rate_limit_deg: 120.0
  mpc_prediction_horizon: 45
  mpc_prediction_sampling_time: 0.1
  mpc_weight_lat_error: 30.0
  mpc_weight_heading_error: 3.0
  mpc_weight_heading_error_squared_vel_coeff: 0.03
  mpc_weight_steering_input: 1.0
  mpc_weight_steering_input_squared_vel_coeff: 1.0
  mpc_weight_lat_jerk: 1.0
  mpc_weight_terminal_lat_error: 30.0
  mpc_weight_terminal_heading_error: 0.1
  mpc_zero_ff_steer_deg: 0.0
  steering_lpf_cutoff_hz: 3.0
  qpoases_max_iter: 500
  morai_min_prediction_length_m: 40.0
  morai_max_prediction_horizon: 75
  morai_use_output_steering_filter: false
  morai_straight_lat_weight_scale: 0.3
  morai_curve_steer_weight_scale: 0.25
  morai_weight_curvature_low: 0.005
  morai_weight_curvature_high: 0.03
  morai_weight_first_steer_change: 2.0
  morai_weight_front_point_error: 10.0
  morai_front_overhang_m: 0.845
longitudinal:
  solver: "osqp"
  horizon_steps: 6
  optimizer_iterations: 10
  line_search_steps: 8
  prediction_dt_sec: 0.05
  gradient_epsilon: 0.001
  gradient_step: 0.08
  gradient_tolerance: 1.0e-5
  coordinate_initial_step: 0.20
  coordinate_minimum_step: 0.01
  command_step_decay: 0.5
  maximum_accel_command: 0.15
  maximum_brake_command: 1.0
  command_rate_limit_per_sec: 20.0
  acceleration_gain_mps2: 5.74
  braking_gain_mps2: 18.76
  actuator_time_constant_sec: 0.30
  physical_rollout: true
  constant_drag_mps2: 0.0408
  quadratic_drag_per_m: 0.007326
  maximum_acceleration_mps2: 6.0
  maximum_deceleration_mps2: 15.0
  maximum_jerk_mps3: 3.0
  acceleration_estimate_filter_time_constant_sec: 0.10
  speed_weight: 80.0
  acceleration_weight: 0.20
  jerk_weight: 0.08
  command_weight: 0.08
  command_rate_weight: 0.3
  terminal_speed_weight: 240.0
# Shared actuator delay/tau/gain for prediction and the lateral vehicle model.
steering_prediction:
  delay_sec: 0.10
  time_constant_sec: 0.05
  gain: 0.75
