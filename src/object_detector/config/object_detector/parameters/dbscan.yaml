# #C5_PARAMETERS
# C5: voxel 변 길이와 3D 이웃 반경은 m, 나머지는 voxel 이후 점 개수다.
# MinPts는 자기 자신을 포함한다. 이 값은 생성자 설정이며 알고리즘을 바꾸지 않는다.
voxel_leaf_size: 0.075
dbscan_eps: 0.16
dbscan_min_points: 8
min_cluster_size: 6
max_cluster_size: 1000
# #ROI_INTEGRATION
# base_link_level의 임시 Fixed ROI이다. 최종 RDDF ROI Core는 별도 담당자가 개발한다.
# 현재 Dbscan에서 한 번 crop한다. 새 ROI Core와 연결할 때 중복 crop을 해소해야 한다.
roi_x_min: 0.0
roi_x_max: 20.0
roi_y_min: -5.0
roi_y_max: 5.0
roi_z_min: 0.2
roi_z_max: 2.0
