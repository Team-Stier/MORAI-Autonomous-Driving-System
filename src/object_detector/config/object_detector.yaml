execution_mode: on_input
frequency_hz: 10.0
queue_capacity: 8
max_health_checks: 10
# #FRAME_CONTRACT
# ROI·VoxelGrid·DBSCAN·OBB는 입력 base_link_level 좌표에서 계산하고 /objects도
# 같은 frame으로 발행한다. 장착 TF나 차량 roll/pitch를 다시 적용하지 않는다.
# 차체 고정 base_link로 이름만 바꾸면 좌표값과 계약이 달라지므로 소비 모듈의
# 입력 경계에서 메시지 시각에 맞는 실제 변환을 수행해야 한다.
frame: base_link_level
stale_after_sec: 0.3
receive_timeout_sec: 0.3
max_sensor_skew_sec: 0.1
# 빈 문자열은 해당 단계의 Core 미등록을 뜻한다. 등록 후 파일 이름으로 변경한다.
stage1:
  section_core_map:
    "0": dbscan.hpp
    "1": dbscan.hpp
    "2": dbscan.hpp
    "3": dbscan.hpp
    "4": dbscan.hpp
    "5": dbscan.hpp
    "6": dbscan.hpp
    "7": dbscan.hpp
    "8": dbscan.hpp
    "9": dbscan.hpp
    "10": dbscan.hpp
    "11": dbscan.hpp
    "12": dbscan.hpp
    "13": dbscan.hpp
    "14": dbscan.hpp
    "15": dbscan.hpp
    "16": dbscan.hpp
  health_core_map: []
stage2:
  section_core_map:
    "0": objects_pass_through.hpp
    "1": objects_pass_through.hpp
    "2": objects_pass_through.hpp
    "3": objects_pass_through.hpp
    "4": objects_pass_through.hpp
    "5": objects_pass_through.hpp
    "6": objects_pass_through.hpp
    "7": objects_pass_through.hpp
    "8": objects_pass_through.hpp
    "9": objects_pass_through.hpp
    "10": objects_pass_through.hpp
    "11": objects_pass_through.hpp
    "12": objects_pass_through.hpp
    "13": objects_pass_through.hpp
    "14": objects_pass_through.hpp
    "15": objects_pass_through.hpp
    "16": objects_pass_through.hpp
  health_core_map: []
trigger_input: /velodyne_points/leveled
inputs:
  cloud: {stale_after_sec: 0.300000000, receive_timeout_sec: 0.300000000}
# Development starting values; not tuned for MORAI driving.
dbscan:
  roi_x_min: 0.0
  roi_x_max: 20.0
  roi_y_min: -5.0
  roi_y_max: 5.0
  roi_z_min: 0.2
  roi_z_max: 2.0
  voxel_leaf_size: 0.04
  dbscan_eps: 0.18
  dbscan_min_points: 4
  min_cluster_size: 5
  max_cluster_size: 1000
