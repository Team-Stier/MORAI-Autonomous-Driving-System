acceleration_noise: 3.0       # m/s² 표준편차
gps_position_noise: 0.03      # m 표준편차
velocity_noise: 0.10          # m/s 표준편차
gps_height_m: 1.2             # base_link 위 GPS 장착 높이
yaw_offset_rad: -0.023509     # GT heading→UTM 격자 heading
max_prediction_dt_sec: 0.5   # 0 < dt <= 이 값만 IMU 예측, 역행·0 스탬프·긴 공백은 GPS fix로 다시 초기화
