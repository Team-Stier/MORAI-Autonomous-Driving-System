execution: {mode: periodic, frequency_hz: 50.0, reference_input: imu, queue_capacity: 8, max_health_checks: 10}
section_topic: /section_annotation
max_skew_sec: 0.06
inputs:
  gps:
    type: sensor_msgs/NavSatFix
    topic: /sensors/gps/fix
    frame: gps_link
    numbers: [latitude, longitude, altitude]
    stale_after_sec: 0.1
    receive_timeout_sec: 0.1
  imu:
    type: sensor_msgs/Imu
    topic: /sensors/imu/data
    frame: imu_link
    numbers: [linear_acceleration.x, linear_acceleration.y, linear_acceleration.z]
    stale_after_sec: 0.15
    receive_timeout_sec: 0.15
  competition:
    type: interfaces/CompetitionVehicleStatus
    topic: /vehicle/competition_status
    frame: base_link
    numbers: [roll_rad, pitch_rad, yaw_rad, velocity_x_mps, angular_velocity_x_radps, angular_velocity_y_radps, angular_velocity_z_radps]
    stale_after_sec: 0.15
    receive_timeout_sec: 0.15
  lidar:
    type: sensor_msgs/PointCloud2
    topic: /velodyne_points/leveled
    frame: base_link_level
    stale_after_sec: 0.3
    receive_timeout_sec: 0.3
    check_skew: false
stages:
  - name: estimate
    outputs:
      - {name: ego, type: nav_msgs/Odometry}
output: {topic: /localization/ego, frame_id: map}
