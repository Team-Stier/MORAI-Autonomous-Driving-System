control_step_m: 2.0
integration_step_m: 0.05
sample_step_m: 0.25
local_path_length_m: 40.0
# Rightward clearance for the Ioniq5 front-left corner, applied to spline controls.
entry_shift_m: 0.15
entry_shift_center_m: 886.0
entry_shift_half_length_m: 7.0
exit_shift_m: 0.4
exit_shift_center_m: 914.0
exit_shift_half_length_m: 9.0
# Traffic speed planning, all speed values are m/s.
desired_speed_mps: 5.0
max_acceleration_mps2: 2.0
max_deceleration_mps2: 4.0
max_jerk_mps3: 4.0
max_lateral_acceleration_mps2: 2.0
time_step_sec: 0.25
command_step_sec: 0.8
beam_width: 32
collision_margin_m: 0.7
prediction_uncertainty_mps: 0.2
following_time_gap_sec: 1.2
