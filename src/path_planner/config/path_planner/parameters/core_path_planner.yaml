# #REGULATION_SPEED_TRANSITION
# 20m/s 시험 상한을 제거한다. 고주로 100km/h는 기존 팀 운용 목표이며,
# 일반 60km/h와 공식 예외 Link를 기존 설정/정적 자산에서 주입한다.
max_speed_mps: 27.77777777777778
normal_speed_parameters_file: ../velocity_planner/config/velocity_planner/parameters/curvature_velocity60.yaml
exception_speed_parameters_file: ../velocity_planner/config/velocity_planner/parameters/curvature_velocity100.yaml
speed_exemption_links_file: models/competition_speed_exemption_links.txt
speed_limit_response_sec: 0.5
max_lateral_slope: 0.8
max_initial_heading_error_rad: 0.5
max_initial_distance_m: 5.0
reference_weight: 0.2
dp_tracking_weight: 3.0
slope_weight: 2.0
bending_weight: 20.0
