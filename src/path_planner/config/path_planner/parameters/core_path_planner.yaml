# 같은 방향 앞차와 범퍼 간격에 따른 추종 목표. 기존 충돌 검사는 별도 유지한다.
following_time_headway_sec: 1.5
following_min_gap_m: 2.0
# 100km/h의 5초 예측 거리(약139m)를 같은 0.25m 공간 표본으로 포함한다.
trajectory_horizon_m: 150.0
# 전방 도로 주변 보행자 접근 비교 시험. 물리 bbox·관측 속도·충돌 한도는 유지한다.
pedestrian_caution_speed_mps: 8.333333333333334  # 보행자 감지 시 30km/h 상한
pedestrian_caution_distance_m: 80.0

# 가까운 보행자 접근 비용 목표(21.6km/h). 30km/h 상한과 기존 안전 제약은 별도 유지.
pedestrian_near_preferred_speed_mps: 6.0
