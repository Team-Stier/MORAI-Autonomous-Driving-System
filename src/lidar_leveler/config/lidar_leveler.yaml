execution_mode: on_input
frequency_hz: 10.0
queue_capacity: 8
max_health_checks: 10
# #FRAME_CONTRACT
# production의 점군은 장착 TF를 한 번 적용한 뒤 roll/pitch가 제거된 base_link_level이다.
# 이 값은 출력 header에 사용한다. 차체 고정 base_link로 이름만 바꾸면 실제 좌표와
# header가 달라져 downstream에서 자세가 중복 적용될 수 있다. PassThrough 비교를
# 별도로 실행할 때만 Core 매핑과 frame을 함께 mounting-only base_link로 바꾼다.
frame: base_link_level
stale_after_sec: 0.3
receive_timeout_sec: 0.3
max_sensor_skew_sec: 0.1
# 빈 문자열은 Core 미등록을 뜻한다. 등록 후 해당 파일 이름으로 변경한다.
stage1:
  section_core_map:
    "0": roll_pitch_leveler.hpp
    "1": roll_pitch_leveler.hpp
    "2": roll_pitch_leveler.hpp
    "3": roll_pitch_leveler.hpp
    "4": roll_pitch_leveler.hpp
    "5": roll_pitch_leveler.hpp
    "6": roll_pitch_leveler.hpp
    "7": roll_pitch_leveler.hpp
    "8": roll_pitch_leveler.hpp
    "9": roll_pitch_leveler.hpp
    "10": roll_pitch_leveler.hpp
    "11": roll_pitch_leveler.hpp
    "12": roll_pitch_leveler.hpp
    "13": roll_pitch_leveler.hpp
    "14": roll_pitch_leveler.hpp
    "15": roll_pitch_leveler.hpp
    "16": roll_pitch_leveler.hpp
  health_core_map: []
trigger_input: /velodyne_points
inputs:
  cloud: {stale_after_sec: 0.300000000, receive_timeout_sec: 0.300000000}
  competition: {stale_after_sec: 0.060000000, receive_timeout_sec: 0.060000000}
  tf_static: {stale_after_sec: 0.060000000, receive_timeout_sec: 0.060000000}
