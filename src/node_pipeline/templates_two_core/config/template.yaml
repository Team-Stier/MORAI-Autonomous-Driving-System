# 가이드 전용. TODO: 실제 토픽·한도·policy·단계별 Core 매핑을 지정한다.
execution_mode: periodic
trigger_input: /node_pipeline_two_core_template/primary
frequency_hz: 50.0
queue_capacity: 8
max_health_checks: 10
frame: map
lower: -1.0
upper: 1.0
stale_after_sec: 0.3
receive_timeout_sec: 0.3
max_sensor_skew_sec: 0.1
# 각 단계는 같은 section과 최종 구독 입력 health로 Core를 선택한다.
core1:
  section_core_map:
    "0": first_core.hpp
  health_core_map: []
core2:
  section_core_map:
    "0": second_core.hpp
  health_core_map: []
input_policy:
  priority:
    Missing: -1
    InvalidStamp: 200
    FutureStamp: 200
    FrameMismatch: 200
    NaN: 200
    Inf: 200
    OutRangePositive: 100
    OutRangeNegative: 100
    Stale: -1
    ReceiveTimeout: -1
    Skew: -1
