# 모델 경로는 패키지 디렉터리 기준이다. 입력 크기는 모델의 정적 입력 [1,3,H,W]와 같아야 한다.
model: models/traffic_light_yolo11m.onnx
# cuda | cpu. 지정한 장치로만 세션을 만든다.
device: cuda
input_width: 1280
input_height: 1280
# 모델 출력 클래스 인덱스 순서다. lamp는 클래스가 뜻하는 점등 등(red | yellow | green | left)이다.
classes:
  "0": {name: go, lamp: green, confidence: 0.40}
  "1": {name: left_turn, lamp: left, confidence: 0.40}
  "2": {name: prepare_stop, lamp: yellow, confidence: 0.35}
  "3": {name: stop, lamp: red, confidence: 0.40}
nms_iou: 0.45
# 최근 history_size 프레임(UNKNOWN 포함)에서 minimum_votes 이상 득표한 상태를 반환한다.
history_size: 5
minimum_votes: 3
